---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.0
serverless_language: ''
polling_url: |-
  https://api.met.no/weatherapi/locationforecast/2.0/complete?lat={{ latitude }}&lon={{ longitude }}
  https://api.met.no/weatherapi/metalerts/2.0/current.json?lat={{ latitude }}&lon={{ longitude }}&lang=en
polling_headers: user-agent=trmnl-met-norway/1.0%20github.com/iler/trmnl-met-norway
polling_body: ''
id: 460164
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: environment,nature
  description: >-
    A forecast for one place, and the severe weather warnings that MET Norway
    issues for it: the weather now, the next 12 hours in steps of 2 hours, and
    the next 5 days. When MET Norway issues a warning for your place, a band
    across the top of the screen names it. Severity is a word, not a colour,
    because the screen has only black and white.
    <br><br>
    The warnings are the reason this recipe exists. MET Norway issues them for
    Norway only, so most places never show one. When there is no warning, the
    screen gives that space back to the forecast.
    <br><br>
    Set a latitude and a longitude with 4 decimals at most, because MET Norway
    refuses more than 4. A location name is optional: the forecast carries no
    place name, so without it the screen has nothing to call the place.
    <br><br>
    Keep the refresh rate at 60 minutes or slower. MET Norway counts requests
    for the whole recipe, across everyone who installs it, so a faster rate
    risks throttling for every installer and not only for you.
    <br><br>
    Built by Ilari Mäkelä. Data from MET Norway, licensed
    <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Not
    an official MET Norway plugin, and not endorsed by MET Norway. Source and
    issues:
    <a href="https://github.com/iler/trmnl-met-norway">github.com/iler/trmnl-met-norway</a>
    &middot; MET Norway API:
    <a href="https://api.met.no/">api.met.no</a>
  help_text: >-
    Your coordinates are stored by TRMNL. TRMNL's own servers send them to MET
    Norway once an hour and keep the answer until the next refresh; your display
    never contacts MET Norway itself. The plugin reads a public forecast, writes
    nothing, and sends nothing anywhere else.
  github_url: https://github.com/iler/trmnl-met-norway
  learn_more_url: https://api.met.no/
- keyname: latitude
  field_type: string
  name: Latitude
  description: Latitude of the place, with 4 decimals at most.
  placeholder: '60.1699'
  help_text: MET Norway rejects 5 or more decimals with a 403 error.
  required: true
- keyname: longitude
  field_type: string
  name: Longitude
  description: Longitude of the place, with 4 decimals at most.
  placeholder: '24.9384'
  help_text: MET Norway rejects 5 or more decimals with a 403 error.
  required: true
- keyname: location_name
  field_type: string
  name: Location name
  description: Shown on the screen. The forecast gives no place name.
  placeholder: Helsinki
  optional: true
name: Forecast and Warnings
description: Forecast and weather warnings
refresh_interval: 60
