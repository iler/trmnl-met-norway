---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.0
serverless_language: ''
polling_url: |-
  https://api.met.no/weatherapi/locationforecast/2.0/complete?lat={{ latitude }}&lon={{ longitude }}
  https://api.met.no/weatherapi/metalerts/2.0/current.json?lat={{ latitude }}&lon={{ longitude }}&lang=en
polling_headers: user-agent=trmnl-met-norway/1.0%20github.com/iler/trmnl-met-norway
polling_body: ''
id: 460164
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: environment,nature
  description: |-
    A forecast for one place, and the severe weather warnings that MET Norway
    issues for it.

    What the screen shows:
    - Now: the weather symbol, the temperature, the feels-like temperature and
      the wind.
    - The next 12 hours, in steps of 2 hours, with the chance of precipitation.
    - The next 5 days, with the highest and the lowest temperature.
    - A warning band, when MET Norway issues a warning for your place.

    The warnings are the reason this plugin exists. MET Norway issues them for
    Norway only, so most places never show one. When there is no warning, the
    screen gives that space to the forecast instead. Severity is a word, not a
    colour, because the screen has only black and white.

    To set it up, give a latitude and a longitude with 4 decimals at most. MET
    Norway refuses more than 4. A location name is optional: the forecast does
    not supply one, so the screen has nothing to call the place without it.

    Keep the refresh rate at 60 minutes or slower. MET Norway counts requests
    for the whole plugin, across everyone who installs it. A faster rate risks
    MET Norway throttling the plugin for every installer, not only for you.

    Data from MET Norway, licensed CC BY 4.0, see
    creativecommons.org/licenses/by/4.0/. This is not an official MET Norway
    plugin. MET Norway does not endorse it.

    Source, and a place to report a fault: github.com/iler/trmnl-met-norway
  github_url: https://github.com/iler/trmnl-met-norway
  learn_more_url: https://api.met.no/
- keyname: latitude
  field_type: string
  name: Latitude
  description: Latitude of the place, with 4 decimals at most.
  placeholder: '60.1699'
  help_text: MET Norway rejects 5 or more decimals with a 403 error.
  required: true
- keyname: longitude
  field_type: string
  name: Longitude
  description: Longitude of the place, with 4 decimals at most.
  placeholder: '24.9384'
  help_text: MET Norway rejects 5 or more decimals with a 403 error.
  required: true
- keyname: location_name
  field_type: string
  name: Location name
  description: Shown on the screen. The forecast gives no place name.
  placeholder: Helsinki
  optional: true
name: Forecast and Warnings
description: Forecast and weather warnings
refresh_interval: 60
